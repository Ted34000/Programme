<title>Ma Trésorerie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : appli à une colonne (max 1080px). En-tête collant avec onglets défilants, vues en cartes, formulaires dans un panneau modal. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #F7F9F8;
  --ink: #14201E;
  --muted: #5A6A66;
  --line: #DAE2DF;
  --accent: #0D6B61;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFEEEB;
  --credit: #1B7A49;
  --debit: #B0412D;
  --vir: #2C6CAC;
  --ok: #1B7A49; --ok-soft: #DFF0E6;
  --warn: #9A6200; --warn-soft: #FAEED5;
  --crit: #B3261E; --crit-soft: #F8E1DE;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --grid: #E7ECEA;
  --shadow: 0 1px 2px rgba(20,32,30,.05), 0 4px 14px rgba(20,32,30,.05);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1514; --surface: #162020; --surface-2: #1A2524; --ink: #E3EBE9; --muted: #98A9A4; --line: #2A3735;
    --accent: #5BC1B2; --accent-ink: #0E1514; --accent-soft: #173330;
    --credit: #62C98F; --debit: #EE8B76; --vir: #7FB2E8;
    --ok: #62C98F; --ok-soft: #16301F; --warn: #E3B04E; --warn-soft: #382C13; --crit: #F08A80; --crit-soft: #3A1F1C;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --grid: #22302E; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514; --surface: #162020; --surface-2: #1A2524; --ink: #E3EBE9; --muted: #98A9A4; --line: #2A3735;
  --accent: #5BC1B2; --accent-ink: #0E1514; --accent-soft: #173330;
  --credit: #62C98F; --debit: #EE8B76; --vir: #7FB2E8;
  --ok: #62C98F; --ok-soft: #16301F; --warn: #E3B04E; --warn-soft: #382C13; --crit: #F08A80; --crit-soft: #3A1F1C;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --grid: #22302E; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--f-ui); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 80px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1080px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.pos { color: var(--credit); } .neg { color: var(--debit); } .virc { color: var(--vir); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }

/* En-tête */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 0; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 24px; }
.brand .date { font-size: 13px; color: var(--muted); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync[data-s="ok"]::before { background: var(--ok); }
.sync[data-s="saving"]::before { background: var(--warn); }
.sync[data-s="local"]::before { background: var(--warn); }
.sync[data-s="err"]::before { background: var(--crit); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-top: 10px; border-bottom: 1px solid var(--line); }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; padding: 9px 12px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
nav.tabs a[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs a .badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; text-align: center; line-height: 18px; }

main { display: grid; gap: 16px; padding-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.grid2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
.kpi .lab { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.kpi .val { font-size: 22px; font-weight: 600; }
.kpi .sub { font-size: 13px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--crit); }
.btn.danger.armed { background: var(--crit); color: #fff; border-color: var(--crit); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select.inline, input.inline { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 14px; }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }

.alert { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; }
.alert + .alert { margin-top: 8px; }
.alert.warn { background: var(--warn-soft); }
.alert.crit { background: var(--crit-soft); }
.alert.ok { background: var(--ok-soft); }
.alert .ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--surface); }
.alert.warn .ic { background: var(--warn); } .alert.crit .ic { background: var(--crit); } .alert.ok .ic { background: var(--ok); }
.alert .t { min-width: 0; }
.banner { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

.list { display: grid; }
.li { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li.click { cursor: pointer; border-radius: 6px; }
.li.click:hover { background: var(--surface-2); }
.li .main { min-width: 0; }
.li .main b { font-weight: 600; }
.li .meta { font-size: 13px; color: var(--muted); }
.li.off { opacity: .55; }
.dt { font-family: var(--f-num); font-size: 12px; color: var(--muted); width: 56px; text-align: center; line-height: 1.2; }
.dt b { display: block; font-size: 18px; color: var(--ink); font-weight: 600; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }

.bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar.warn > i { background: var(--warn); } .bar.crit > i { background: var(--crit); } .bar.ok > i { background: var(--ok); }

.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Tableaux */
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }
tr.tot td { font-weight: 700; border-bottom: 0; border-top: 2px solid var(--line); }

/* Graphique */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--f-num); font-size: 11px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 16px; height: 0; border-top: 2px solid; display: inline-block; }
.legend i.dash { border-top-style: dashed; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); min-width: 150px; z-index: 2; }
.tip .d { color: var(--muted); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .r span { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.tip .r i { width: 12px; border-top: 2px solid; display: inline-block; }
.tip .r b { font-family: var(--f-num); font-weight: 600; color: var(--ink); }

/* Calendrier */
.cal-nav { display: flex; align-items: center; gap: 8px; }
.cal-nav h2 { min-width: 170px; text-align: center; text-transform: capitalize; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .wd { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); text-align: center; padding-bottom: 4px; font-weight: 600; }
.cal .day { min-height: 92px; border: 1px solid var(--line); border-radius: 8px; padding: 5px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.cal .day.out { background: transparent; border-style: dashed; opacity: .5; }
.cal .day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal .day.sel { background: var(--accent-soft); }
.cal .day .n { font-family: var(--f-num); font-size: 12px; font-weight: 600; }
.cal .chip { font-size: 11px; line-height: 1.25; padding: 2px 4px; border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid; background: var(--surface-2); }
.cal .chip.d { border-color: var(--debit); } .cal .chip.c { border-color: var(--credit); } .cal .chip.v { border-color: var(--vir); }
.cal .more { font-size: 11px; color: var(--muted); }
.cal .dots { display: none; gap: 3px; flex-wrap: wrap; }
.cal .dots i { width: 6px; height: 6px; border-radius: 50%; }
.cal .dots i.d { background: var(--debit); } .cal .dots i.c { background: var(--credit); } .cal .dots i.v { background: var(--vir); }
@media (max-width: 640px) {
  .cal .day { min-height: 52px; align-items: center; }
  .cal .chip, .cal .more { display: none; }
  .cal .dots { display: flex; justify-content: center; }
  .cal-nav h2 { min-width: 0; font-size: 16px; }
}

/* Comptes */
.accs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.acc { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); display: grid; gap: 8px; cursor: pointer; text-align: left; }
.acc:hover { border-color: var(--accent); }
.acc .h { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.acc .bal { font-size: 22px; font-weight: 600; }
.acc .use { font-size: 13px; color: var(--muted); }

/* Formulaires */
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); align-items: end; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 15px; }
.field textarea { min-height: 64px; resize: vertical; }
.field .hint { font-size: 12px; color: var(--muted); }
.field.check { display: flex; align-items: center; gap: 8px; }
.field.check input { width: auto; }
.field.full { grid-column: 1 / -1; }
.err { color: var(--crit); font-size: 13px; }

.sheet-back { position: fixed; inset: 0; background: rgba(10,18,17,.45); z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border-radius: 14px; width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 18px; display: grid; gap: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.sheet .foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }

.verdict { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.cmp .lab { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.cmp .v { font-size: 16px; }
.obj { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.obj:first-child { border-top: 0; padding-top: 0; }
.obj .h { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.obj .m { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div>
        <h1>Ma Trésorerie</h1>
        <div class="date" id="today-label"></div>
      </div>
      <span class="sync" id="sync" data-s="saving">Connexion…</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </header>
  <main id="view" aria-live="polite">
    <div class="card empty">Chargement de tes comptes…</div>
  </main>
</div>
<div id="sheet"></div>

<script>
(() => {
"use strict";
/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NF = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR" });
const NF0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const eur = v => NF.format(v || 0);
const eur0 = v => NF0.format(Math.round(v || 0));
const sgn = v => (v > 0 ? "+" : v < 0 ? "−" : "") + NF.format(Math.abs(v || 0));
const DAY = 864e5;
const D = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
const S = t => new Date(t).toISOString().slice(0, 10);
const addDays = (s, n) => S(D(s) + n * DAY);
const diffDays = (a, b) => Math.round((D(b) - D(a)) / DAY);
const dim = (y, m0) => new Date(Date.UTC(y, m0 + 1, 0)).getUTCDate();
const pad = n => String(n).padStart(2, "0");
function addMonths(s, k, day) {
  let y = +s.slice(0, 4), m = +s.slice(5, 7) - 1 + k;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  const d = Math.min(day ?? +s.slice(8, 10), dim(y, m));
  return `${y}-${pad(m + 1)}-${pad(d)}`;
}
const TODAY = (() => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth() + 1)}-${pad(n.getDate())}`; })();
const monthStart = s => s.slice(0, 8) + "01";
const monthEnd = s => addDays(addMonths(monthStart(s), 1), -1);
const fmtD = (s, o) => new Date(D(s)).toLocaleDateString("fr-FR", { timeZone: "UTC", ...o });
const fDate = s => fmtD(s, { day: "2-digit", month: "2-digit", year: "numeric" });
const fDay = s => fmtD(s, { weekday: "short", day: "numeric", month: "short" });
const fMonth = s => fmtD(s, { month: "long", year: "numeric" });
const fMonthS = s => fmtD(s, { month: "short", year: "2-digit" });
const uid = () => Math.random().toString(36).slice(2, 10);
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const FREQ = {
  mensuel: { l: "Mensuel", step: 1, f: 1 },
  bimestriel: { l: "Tous les 2 mois", step: 2, f: 1 / 2 },
  trimestriel: { l: "Trimestriel", step: 3, f: 1 / 3 },
  semestriel: { l: "Semestriel", step: 6, f: 1 / 6 },
  annuel: { l: "Annuel", step: 12, f: 1 / 12 },
  hebdo: { l: "Hebdomadaire", step: 0, f: 52 / 12 },
  ponctuel: { l: "Ponctuel", step: 0, f: 0 },
};
const SENS = { debit: "Prélèvement / dépense", credit: "Revenu / encaissement", virement: "Virement entre mes comptes" };
const TYPES = { courant: "Compte courant", epargne: "Livret / épargne", joint: "Compte joint", placement: "Placement", autre: "Autre" };
const OBJ_TYPES = {
  epargne: "Atteindre un montant d'épargne",
  seuil: "Garder un solde minimum",
  plafond: "Plafonner une dépense variable",
  taux: "Taux d'épargne mensuel",
};
const TABS = [
  ["tableau", "Tableau de bord"], ["planning", "Planning"], ["operations", "Prélèvements"], ["comptes", "Comptes"],
  ["soldes", "Soldes"], ["prevision", "Prévision"], ["variables", "Dépenses variables"], ["objectifs", "Objectifs"],
];

/* ---------- État ---------- */
const emptyState = () => ({
  version: 1, exemple: false,
  params: { alerteJours: 3, horizonMois: 6, moisMoyenne: 3 },
  comptes: [], operations: [], releves: [], depenses: [],
  categories: [
    { id: uid(), nom: "Alimentation", inclure: true, compteId: "", fixe: null },
    { id: uid(), nom: "Carburant", inclure: true, compteId: "", fixe: null },
  ],
  objectifs: [],
});
function normalize(d) {
  const e = emptyState();
  const s = { ...e, ...(d || {}) };
  s.params = { ...e.params, ...(s.params || {}) };
  for (const k of ["comptes", "operations", "releves", "depenses", "categories", "objectifs"]) if (!Array.isArray(s[k])) s[k] = [];
  return s;
}
let state = normalize(lsGet("treso-cache"));
let rev = 0;
const ui = Object.assign({
  month: monthStart(TODAY), selDay: TODAY, horizon: 6, scope: "total",
  atDate: addDays(TODAY, 30), atAcc: "total", simu: null,
}, lsGet("treso-ui") || {});
ui.month = ui.month || monthStart(TODAY);

function occurrences(op, from, to) {
  const out = [];
  if (op.actif === false || !op.debut) return out;
  const end = op.fin && op.fin < to ? op.fin : to;
  if (op.debut > end) return out;
  if (op.freq === "ponctuel") { if (op.debut >= from) out.push(op.debut); return out; }
  if (op.freq === "hebdo") {
    let d = op.debut;
    if (d < from) d = addDays(d, Math.ceil(diffDays(d, from) / 7) * 7);
    for (; d <= end; d = addDays(d, 7)) out.push(d);

  let k = mb > step ? Math.floor((mb - 1) / step) : 0;

}

const simCache = new Map();
function simulate(to, extra = []) {
  const key = rev + "|" + to + "|" + JSON.stringify(extra);

  if (simCache.size > 20) simCache.clear();
  const accs = state.comptes;
  const rels = state.releves.filter(r => accById(r.compteId) && r.date).sort((a, b) => a.date < b.date ? -1 : 1);
  let start = rels.length ? rels[0].date : TODAY;
  if (start > TODAY) start = TODAY;
  if (to < TODAY) to = TODAY;
  const n = diffDays(start, to) + 1;
  const dates = new Array(n);
  for (let i = 0; i < n; i++) dates[i] = addDays(start, i);
  const idx = new Map(dates.map((d, i) => [d, i]));
  const day = Array.from({ length: n }, () => []);
  const def = defaultAcc();
  const allOps = [...state.operations, ...extra];
  for (const op of allOps) {
    for (const d of occurrences(op, start, to)) {
      const i = idx.get(d), m = op.montant || 0;
      if (op.sens === "virement") {
        day[i].push({ c: op.compteId, v: -m, vir: true });
        day[i].push({ c: op.compteDest, v: m, vir: true });
      } else day[i].push({ c: op.compteId, v: op.sens === "credit" ? m : -m });
    }
  }
  for (const e of state.depenses) {
    if (e.date >= start && e.date <= TODAY) day[idx.get(e.date)].push({ c: accById(e.compteId) ? e.compteId : def, v: -(e.montant || 0), varr: true });
  }
  // Budget variable : reste du mois en cours étalé jusqu'à la fin du mois, puis budget mensuel étalé par jour
  const cats = state.categories.filter(c => c.inclure);
  const tIdx = idx.get(TODAY);
  const curEnd = monthEnd(TODAY), leftDays = diffDays(TODAY, curEnd);
  for (const cat of cats) {
    const B = budgetCat(cat); if (!B) continue;
    const c = accById(cat.compteId) ? cat.compteId : def; if (!c) continue;
    const rest = Math.max(0, B - spend(cat.nom, ym(TODAY)));
    for (let i = tIdx + 1; i < n; i++) {
      const d = dates[i];
      const v = d <= curEnd ? (leftDays ? rest / leftDays : 0) : B / dim(+d.slice(0, 4), +d.slice(5, 7) - 1);
      if (v) day[i].push({ c, v: -v, varr: true, fut: true });

  const relDay = new Map();
  for (const r of rels) { if (!relDay.has(r.date)) relDay.set(r.date, new Map()); relDay.get(r.date).set(r.compteId, r); }
  const hasRel = new Set(rels.map(r => r.compteId));
  const bal = {}, inA = {}, outA = {}, cur = {};
  for (const a of accs) { bal[a.id] = new Array(n).fill(null); inA[a.id] = new Array(n).fill(0); outA[a.id] = new Array(n).fill(0); cur[a.id] = null; }
  const total = new Array(n).fill(null), inT = new Array(n).fill(0), outT = new Array(n).fill(0);
  const ecarts = {};
  for (let i = 0; i < n; i++) {
    const d = dates[i], net = {};
    for (const f of day[i]) {
      if (!(f.c in cur)) continue;
      if (cur[f.c] == null && !(hasRel.has(f.c) ? false : d >= TODAY)) continue;
      net[f.c] = (net[f.c] || 0) + f.v;
      if (f.v > 0) inA[f.c][i] += f.v; else outA[f.c][i] -= f.v;
      if (!f.vir) { if (f.v > 0) inT[i] += f.v; else outT[i] -= f.v; }
    }
    let tot = null;
    for (const a of accs) {
      let b = cur[a.id];
      if (b == null && !hasRel.has(a.id) && d === TODAY) b = 0;
      const r = relDay.get(d)?.get(a.id);
      if (r) { if (b != null) ecarts[r.id] = r.solde - (b + (net[a.id] || 0)); b = r.solde; }
      else if (b != null) b += net[a.id] || 0;
      cur[a.id] = b; bal[a.id][i] = b;

}

/* ---------- Indicateurs ---------- */
function synthese() {
  let rev_ = 0, ch = 0, vir = 0;
  for (const o of state.operations) { const m = mensualise(o); if (o.sens === "credit") rev_ += m; else if (o.sens === "debit") ch += m; else vir += m; }
  const varb = budgetVariable();
  return { revenus: rev_, charges: ch, virements: vir, variables: varb, reste: rev_ - ch - varb };
}
function evalObj(o, sim) {
  const h = addMonths(TODAY, state.params.horizonMois || 6);
  if (o.type === "epargne") {
    const cur = valAt(sim, o.compteId, TODAY) ?? 0, cible = o.cible || 0;
    const ech = o.echeance || h, prev = ech <= sim.to ? valAt(sim, o.compteId, ech) : null;
    const mois = Math.max(1, Math.round(diffDays(TODAY, ech) / 30.44));
    const besoin = Math.max(0, (cible - cur) / mois);
    const status = cur >= cible ? "ok" : prev != null && prev >= cible ? "ok" : ech < TODAY ? "crit" : "warn";
    const lab = cur >= cible ? "Atteint" : status === "ok" ? "En bonne voie" : ech < TODAY ? "Échéance dépassée" : "En retard";
    return { pct: cible ? cur / cible : 0, status, lab, left: `${eur0(cur)} sur ${eur0(cible)} · ${accName(o.compteId)}`,
      right: `Échéance ${fDate(ech)}`, detail: prev != null ? `Prévu à l'échéance : ${eur0(prev)} · effort nécessaire : ${eur0(besoin)} / mois` : `Effort nécessaire : ${eur0(besoin)} / mois` };
  }
  if (o.type === "seuil") {
    const scope = o.scope || "total", mn = minOver(sim, scope, TODAY, h), lim = o.minimum || 0;
    const fb = firstBelow(sim, scope, lim, TODAY, h);
    const name = scope === "total" ? "Tous les comptes" : accName(scope);
    return { pct: mn.v == null ? 0 : Math.max(0, Math.min(1, mn.v / (lim || 1) / 2)), bar: false, status: fb ? (mn.v < 0 ? "crit" : "warn") : "ok", lab: fb ? "Seuil franchi" : "Respecté",
      left: `${name} · minimum ${eur0(lim)}`, right: `Point bas ${mn.v == null ? "—" : eur0(mn.v)}${mn.d ? " le " + fDate(mn.d) : ""}`,
      detail: fb ? `Passage sous ${eur0(lim)} prévu le ${fDate(fb.d)}` : `Aucun passage sous le minimum sur ${state.params.horizonMois} mois` };
  }
  if (o.type === "plafond") {
    const cat = state.categories.find(c => c.nom === o.categorie);
    const sp = spend(o.categorie, ym(TODAY)), pl = o.plafond || 0, av = cat ? moyenne(cat).avg : 0;
    const r = pl ? sp / pl : 0;
    return { pct: r, status: r > 1 ? "crit" : r > 0.8 ? "warn" : "ok", lab: r > 1 ? "Dépassé" : r > 0.8 ? "Attention" : "Sous le plafond",
      left: `${o.categorie} · ${eur0(sp)} sur ${eur0(pl)} ce mois`, right: `Moyenne ${eur0(av)} / mois`,
      detail: av > pl ? `La moyenne dépasse le plafond de ${eur0(av - pl)}.` : `Marge moyenne : ${eur0(pl - av)} / mois` };
  }
  if (o.type === "taux") {
    const s = synthese(), t = s.revenus ? s.reste / s.revenus * 100 : 0, cible = o.taux || 0;
    return { pct: cible ? t / cible : 0, status: t >= cible ? "ok" : t >= cible * 0.7 ? "warn" : "crit", lab: t >= cible ? "Atteint" : "Insuffisant",
      left: `${t.toFixed(1).replace(".", ",")} % épargnés · cible ${String(cible).replace(".", ",")} %`, right: `Reste ${eur0(s.reste)} / mois`,
      detail: `Revenus ${eur0(s.revenus)} − charges ${eur0(s.charges)} − variables ${eur0(s.variables)}` };
  }
  return { pct: 0, status: "neutral", lab: "", left: "", right: "", detail: "" };
}
const ICON = { ok: "✓", warn: "!", crit: "✕" };
function computeAlerts(sim) {
  const out = [], N = state.params.alerteJours ?? 3, h = addMonths(TODAY, state.params.horizonMois || 6);
  for (const { d, op } of opsBetween(TODAY, addDays(TODAY, N), opsActive())) {
    if (op.sens === "credit") continue;
    const j = diffDays(TODAY, d);
    out.push({ lvl: "warn", t: `${op.libelle} : ${eur(op.montant)} ${op.sens === "virement" ? "viré vers " + accName(op.compteDest) : "prélevé"}`,
      s: `${j === 0 ? "Aujourd'hui" : j === 1 ? "Demain" : "Dans " + j + " jours"} · ${fDay(d)} · ${accName(op.compteId)}`, kind: "prel" });
  }
  for (const a of state.comptes) {
    const neg = firstBelow(sim, a.id, 0, TODAY, h);
    if (neg) { out.push({ lvl: "crit", t: `${a.nom} : découvert prévu`, s: `Solde prévu ${eur(neg.v)} le ${fDate(neg.d)}`, kind: "seuil" }); continue; }
    if (a.seuil != null && a.seuil !== "") {
      const fb = firstBelow(sim, a.id, +a.seuil, TODAY, h);
      if (fb) out.push({ lvl: "warn", t: `${a.nom} passe sous ${eur0(+a.seuil)}`, s: `Solde prévu ${eur(fb.v)} le ${fDate(fb.d)}`, kind: "seuil" });
    }
  }
  return out;
}

function vPlanning() {
  if (!state.comptes.length) return noAccount();
  const m0 = ui.month, mEnd = monthEnd(m0);
  const rows = opsBetween(m0, mEnd, opsActive());
  const byDay = new Map(); rows.forEach(r => { if (!byDay.has(r.d)) byDay.set(r.d, []); byDay.get(r.d).push(r.op); });
  const firstDow = (new Date(D(m0)).getUTCDay() + 6) % 7;
  const gridStart = addDays(m0, -firstDow);
  const cells = Math.ceil((firstDow + diffDays(m0, mEnd) + 1) / 7) * 7;
  const k = o => o.sens === "credit" ? "c" : o.sens === "virement" ? "v" : "d";
  let cal = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map(w => `<div class="wd">${w}</div>`).join("");
  for (let i = 0; i < cells; i++) {
    const d = addDays(gridStart, i), ops = byDay.get(d) || [];
    const out = d < m0 || d > mEnd;
    cal += `<button type="button" class="day${out ? " out" : ""}${d === TODAY ? " today" : ""}${d === ui.selDay ? " sel" : ""}" data-act="sel-day" data-d="${d}" aria-label="${esc(fDay(d))}, ${ops.length} opération(s)">
      <span class="n">${+d.slice(8)}</span>
      ${ops.slice(0, 3).map(o => `<span class="chip ${k(o)}">${esc(o.libelle)}</span>`).join("")}${ops.length > 3 ? `<span class="more">+${ops.length - 3}</span>` : ""}
      <span class="dots">${ops.map(o => `<i class="${k(o)}"></i>`).join("")}</span></button>`;

function simuExtra(p) {

  if (p.mode === "comptant") ex.push({ ...base, id: "sim1", libelle: p.lib || "Achat", montant: m, freq: "ponctuel", debut: p.date });

      <div class="field"><label for="dp-montant">Montant</label><input id="dp-montant" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>
      ${state.comptes.length > 1 ? `<div class="field"><label for="dp-acc">Payé avec</label><select id="dp-acc">${accOptions().map(([k, l]) => `<option value="${esc(k)}"${k === (ui.lastAcc || defaultAcc()) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select></div>` : ""}
      <div class="field"><label for="dp-note">Note</label><input id="dp-note" placeholder="Facultatif"></div>
      <div class="field"><button class="btn primary" type="submit">Ajouter</button></div>
    </form>` : '<div class="empty">Crée d\'abord une catégorie.</div>'}
  </section>
  <section class="card"><div class="card-head"><h2>Moyennes à intégrer au budget</h2>
    <div class="row-actions"><label class="small muted">Moyenne sur <select class="inline" data-param="moisMoyenne">${[1, 2, 3, 6, 12].map(n => `<option value="${n}"${n === N ? " selected" : ""}>${n} mois</option>`).join("")}</select></label>
    <button class="btn sm" data-act="add-cat">+ Catégorie</button></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Catégorie</th>${months.map(m => `<th class="r">${esc(fMonthS(m + "-01"))}</th>`).join("")}<th class="r">Moyenne</th><th class="r">Budget retenu</th><th class="r">Prévisions</th><th>${esc(fmtD(TODAY, { month: "long" }))}</th></tr></thead>
    <tbody>${body}<tr class="tot"><td>Total inclus</td>${colTot.map(v => `<td class="r num">${esc(eur0(v))}</td>`).join("")}<td class="r num">${esc(eur0(totAvg))}</td><td class="r num">${esc(eur0(totBud))}</td><td></td><td class="num small">${esc(eur0(totCur))} / ${esc(eur0(totBud))}</td></tr></tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">Le budget retenu des catégories incluses est ajouté aux prévisions, étalé sur chaque jour du mois. Le mois en cours n'entre pas dans la moyenne. Touche une catégorie pour fixer un budget à la main.</p>
  </section>
  <section class="card"><div class="card-head"><h2>Dernières dépenses</h2><span class="small muted">${state.depenses.length} au total</span></div>
    <div class="list">${recent.length ? recent.map(e => `<div class="li"><div class="dt">${esc(fmtD(e.date, { weekday: "short" }))}<b>${+e.date.slice(8)}</b>${esc(fmtD(e.date, { month: "short" }))}</div>
      <div class="main"><b>${esc(e.categorie)}</b><div class="meta">${esc(e.note || "")}${e.note ? " · " : ""}${esc(accName(e.compteId || defaultAcc()))}</div></div>
      <div class="row-actions"><span class="num neg">−${esc(eur(e.montant))}</span><button class="btn ghost sm danger" data-act="del-dep" data-id="${e.id}" aria-label="Supprimer">Suppr.</button></div></div>`).join("") : '<div class="empty">Aucune dépense saisie. Ajoute tes courses ou pleins des derniers mois pour calculer une moyenne.</div>'}</div>
  </section>`;
}

function vObjectifs() {
  const sim = simulate(SIM_END());
  return `<section class="card"><div class="card-head"><h2>Mes objectifs</h2><button class="btn primary sm" data-act="add-obj">+ Objectif</button></div>
    ${state.objectifs.length ? state.objectifs.map(o => objBlock(o, evalObj(o, sim), false)).join("") : '<div class="empty">Aucun objectif. Exemples : 5 000 € sur le livret d\'ici un an, jamais moins de 200 € sur le compte courant, 350 € de courses par mois au maximum, 10 % de taux d\'épargne.</div>'}
  </section>
  <section class="card"><h2 style="margin-bottom:8px">Comment sont calculés les indicateurs</h2>
    <div class="list small">
      <div class="li"><span class="pill neutral">Épargne</span><div class="main">Solde actuel du compte comparé à la cible ; « en bonne voie » si le solde prévu à l'échéance l'atteint. L'effort mensuel est ce qu'il reste à mettre de côté chaque mois.</div><span></span></div>
      <div class="li"><span class="pill neutral">Minimum</span><div class="main">Point le plus bas prévu sur l'horizon du tableau de bord (${state.params.horizonMois} mois).</div><span></span></div>
      <div class="li"><span class="pill neutral">Plafond</span><div class="main">Dépenses saisies du mois en cours dans la catégorie, et moyenne des mois passés.</div><span></span></div>
      <div class="li"><span class="pill neutral">Taux</span><div class="main">(Revenus − charges fixes − dépenses variables moyennes) ÷ revenus, en équivalent mensuel.</div><span></span></div>
    </div></section>`;
}

/* ---------- Rendu & navigation ---------- */
function currentTab() { const h = location.hash.slice(1); return TABS.some(t => t[0] === h) ? h : "tableau"; }
function render() {
  charts.length = 0;
  const tab = currentTab();
  let nAl = 0;
  try { if (state.comptes.length) nAl = computeAlerts(simulate(SIM_END())).length; } catch {}
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<a href="#${k}"${k === tab ? ' aria-current="page"' : ""}>${l}${k === "tableau" && nAl ? `<span class="badge">${nAl}</span>` : ""}</a>`).join("");
  const fn = { tableau: vTableau, planning: vPlanning, operations: vOperations, comptes: vComptes, soldes: vSoldes, prevision: vPrevision, variables: vVariables, objectifs: vObjectifs }[tab];
  view().innerHTML = (mode === "loading" ? '<span class="loading-flag" hidden></span>' : "") + fn();
  $("#tabs [aria-current]")?.scrollIntoView({ block: "nearest", inline: "nearest" });
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const id = t.dataset.id, act = t.dataset.act;
  switch (act) {
    case "add-compte": return formCompte();
    case "edit-compte": return formCompte(accById(id));
    case "add-op": return formOperation(null, { ...(t.dataset.sens ? { sens: t.dataset.sens } : {}), ...(t.dataset.date ? { debut: t.dataset.date, freq: "ponctuel" } : {}) });
    case "edit-op": return formOperation(state.operations.find(o => o.id === id));
    case "add-rel": return formReleve();
    case "edit-rel": return formReleve(state.releves.find(r => r.id === id));
    case "add-cat": return formCategorie();
    case "edit-cat": return formCategorie(state.categories.find(c => c.id === id));
    case "add-obj": if (!state.comptes.length) { toast("Crée d'abord un compte."); return; } return formObjectif();
    case "edit-obj": return formObjectif(state.objectifs.find(o => o.id === id));
    case "sel-day": ui.selDay = t.dataset.d; if (t.dataset.d < ui.month || t.dataset.d > monthEnd(ui.month)) ui.month = monthStart(t.dataset.d); saveUi(); render(); return;
    case "month": { const k = +t.dataset.k; ui.month = k === 0 ? monthStart(TODAY) : addMonths(ui.month, k, 1); ui.selDay = k === 0 ? TODAY : null; saveUi(); render(); return; }
    case "del-dep":
      if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.classList.add("armed"); t.textContent = "Confirmer"; setTimeout(() => { if (t.isConnected) { t.dataset.armed = ""; t.classList.remove("armed"); t.textContent = "Suppr."; } }, 3500); return; }
      state.depenses = state.depenses.filter(x => x.id !== id); persist(); toast("Dépense supprimée"); return;
    case "clear-ex":
      if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.classList.add("armed"); t.textContent = "Confirmer : tout effacer"; return; }
      state = emptyState(); persist(); toast("Exemples effacés. Commence par ajouter tes comptes."); location.hash = "comptes"; return;
    case "simu-add": {
      const ex = simuExtra(ui.simu); if (!ex.length) return;
      ex.forEach(o => state.operations.push({ ...o, id: uid() }));
      persist(); toast("Achat ajouté au planning"); return;
    }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.param) { state.params[t.dataset.param] = +t.value; persist(); return; }
  if (t.id === "at-date") { ui.atDate = t.value; saveUi(); render(); return; }
  if (t.id === "at-acc") { ui.atAcc = t.value; saveUi(); render(); return; }
  if (t.id === "pv-scope") { ui.scope = t.value; saveUi(); render(); return; }
  if (t.id === "pv-h") { ui.horizon = +t.value; saveUi(); render(); return; }
});
let simuT;
document.addEventListener("input", e => {
  const t = e.target; if (!t.id?.startsWith("sm-")) return;
  ui.simu[t.id.slice(3)] = t.value;
  if (t.id === "sm-mode") document.querySelectorAll("[data-cr]").forEach(el => el.hidden = t.value !== "credit");
  clearTimeout(simuT); simuT = setTimeout(() => { saveUi(); renderSimu(); }, 250);
});
document.addEventListener("submit", e => {
  if (e.target.id !== "dep-form") return;
  e.preventDefault();
  const m = num($("#dp-montant").value), date = $("#dp-date").value, cat = $("#dp-cat").value;
  if (!(m > 0)) { toast("Indique un montant positif."); $("#dp-montant").focus(); return; }
  if (!date || date > TODAY) { toast("Choisis une date passée ou aujourd'hui."); return; }
  const acc = $("#dp-acc")?.value || defaultAcc();
  state.depenses.push({ id: uid(), date, categorie: cat, montant: m, compteId: acc, note: $("#dp-note").value.trim() });
  ui.lastCat = cat; ui.lastDate = date; ui.lastAcc = acc;
  persist(); toast(`${eur(m)} ajoutés en ${cat}`);
  setTimeout(() => $("#dp-montant")?.focus(), 0);
});

$("#today-label").textContent = fmtD(TODAY, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
render();
initStore();
})();
</script>
